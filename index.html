<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-container">
    <div class="header">
      <h1>Todo App</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new todo" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>
    <p id="todo-info" class="todo-info" aria-live="polite">No todos yet. Add your first task to get started.</p>
    <ul id="todo-list" class="todo-list"></ul>
    <div class="todo-footer">
      <span id="todo-count" class="todo-count">0 tasks left</span>
      <button id="clear-completed" class="clear-button" type="button">Clear completed</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
